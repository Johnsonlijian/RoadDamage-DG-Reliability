<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">RoadDamage-DG reliability-audit protocol</title>
  <desc id="desc">A schematic showing archive validation, domain and label-boundary audit, domain-holdout evaluation, prediction-level export, risk-coverage audit, and bounded claim-evidence reporting.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4b7c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #2f4b7c; stroke-width: 2; rx: 8; }
      .soft { fill: #eef5ff; stroke: #2f4b7c; stroke-width: 1.5; rx: 8; }
      .warn { fill: #fff7e8; stroke: #a05a00; stroke-width: 1.5; rx: 8; }
      .title { font: 700 24px Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #2f4b7c; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="620"/>
  <text class="title" x="48" y="44">RoadDamage-DG: reliability-audit protocol and claim boundary</text>
  <text class="small" x="48" y="70">Evidence layer: R08 frozen subset-scale baseline. Output is an audit package, not a detector-performance claim.</text>

  <rect class="box" x="50" y="120" width="170" height="106"/>
  <text class="label" x="70" y="150">1. Archive audit</text>
  <text class="small" x="70" y="176">RDD2022 source</text>
  <text class="small" x="70" y="196">manifest/checksum</text>
  <text class="small" x="70" y="216">safe extraction</text>

  <rect class="box" x="265" y="120" width="190" height="106"/>
  <text class="label" x="285" y="150">2. Domain registry</text>
  <text class="small" x="285" y="176">7 country/capture</text>
  <text class="small" x="285" y="196">domains fixed before</text>
  <text class="small" x="285" y="216">training</text>

  <rect class="box" x="500" y="120" width="200" height="106"/>
  <text class="label" x="520" y="150">3. Label boundary</text>
  <text class="small" x="520" y="176">D00/D10/D20/D40</text>
  <text class="small" x="520" y="196">supervised task</text>
  <text class="small" x="520" y="216">extra labels audited</text>

  <rect class="box" x="745" y="120" width="220" height="106"/>
  <text class="label" x="765" y="150">4. Domain-holdout test</text>
  <text class="small" x="765" y="176">ordinary reference</text>
  <text class="small" x="765" y="196">plus seven held-out</text>
  <text class="small" x="765" y="216">transfer runs</text>

  <rect class="soft" x="50" y="306" width="230" height="122"/>
  <text class="label" x="70" y="336">5. Prediction export</text>
  <text class="small" x="70" y="362">per prediction: class,</text>
  <text class="small" x="70" y="382">confidence, IoU, TP/FP/FN,</text>
  <text class="small" x="70" y="402">domain and matched ground truth</text>

  <rect class="soft" x="335" y="306" width="235" height="122"/>
  <text class="label" x="355" y="336">6. Risk-coverage audit</text>
  <text class="small" x="355" y="362">thresholds are audit probes</text>
  <text class="small" x="355" y="382">not road-agency policies</text>
  <text class="small" x="355" y="402">without operational validation</text>

  <rect class="soft" x="625" y="306" width="235" height="122"/>
  <text class="label" x="645" y="336">7. Error-surface review</text>
  <text class="small" x="645" y="362">hard domains</text>
  <text class="small" x="645" y="382">hard classes</text>
  <text class="small" x="645" y="402">failure patterns</text>

  <rect class="warn" x="915" y="306" width="200" height="122"/>
  <text class="label" x="935" y="336">8. Claim-evidence map</text>
  <text class="small" x="935" y="362">allowed claims</text>
  <text class="small" x="935" y="382">excluded claims</text>
  <text class="small" x="935" y="402">next evidence required</text>

  <path class="arrow" d="M220 173 H265"/>
  <path class="arrow" d="M455 173 H500"/>
  <path class="arrow" d="M700 173 H745"/>
  <path class="arrow" d="M855 226 V270 H165 V306"/>
  <path class="arrow" d="M280 367 H335"/>
  <path class="arrow" d="M570 367 H625"/>
  <path class="arrow" d="M860 367 H915"/>

  <rect class="warn" x="60" y="492" width="1040" height="78"/>
  <text class="label" x="84" y="522">Boundary enforced by the manuscript</text>
  <text class="small" x="84" y="548">No new detector, no state-of-the-art claim, no validated deployment threshold, no full-scale benchmark conclusion.</text>
  <text class="tiny" x="84" y="568">The protocol makes subset-scale cross-domain failure surfaces inspectable before stronger operational claims are attempted.</text>
</svg>
